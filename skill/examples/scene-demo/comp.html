<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<link rel="icon" href="data:,">
<title>codefilm · scene kit demo</title>
<style>
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#F2ECE1}
  #stage{position:absolute;inset:0;overflow:hidden;background:#F2ECE1}
  #stage::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(1100px 700px at 20% 0%,rgba(255,255,255,.5),transparent 60%)}
  .cfs{pointer-events:none}
</style>
</head>
<body>
<div id="stage"></div>
<script src="../../library/motion.js"></script>
<script src="../../library/scenes.js"></script>
<script>
(() => {
  const DUR = 9.4;
  window.__meta = {dur: DUR, fps: 30, w: 1920, h: 1080, loop: false};
  const stage = document.getElementById('stage');

  const title = CF.scenes.title(stage, {text: 'SCENES', sub: 'reusable · pure functions of time', start: 0, out: 1.35});
  const cards = CF.scenes.cards(stage, {start: 1.5, out: 2.95, items: [
    {title: 'One clock', body: 'Every scene is a pure function of t. Seek backwards, jump, render frame 200 first.'},
    {title: 'No raster', body: 'Cards, type and bars are DOM and SVG. No image or video texture in a CODE build.'},
    {title: 'Carry, not replace', body: 'The next scene picks up a thing from the last; a bare card swap is a slideshow.'}
  ]});
  const lines = CF.scenes.lines(stage, {start: 3.05, out: 4.15, items: [
    'Measure the reference', 'Choose the route', 'Write the composition', 'Check every frame'
  ]});
  const chat = CF.scenes.chat(stage, {start: 4.25, out: 5.5, messages: [
    {text: 'Can this be rebuilt in code?'},
    {text: 'Flat type, UI, charts, pixel art → yes.', me: true},
    {text: 'Real people and footage → route to EDIT or GEN.'}
  ]});
  const ledger = CF.scenes.ledger(stage, {start: 5.6, out: 6.75, items: [
    {label: 'frames', to: 960}, {label: 'cuts', to: 8}, {label: 'styles', to: 8}
  ]});
  const chart = CF.scenes.chart(stage, {start: 6.85, out: 7.95, items: [
    {label: 'still', value: .55}, {label: 'cuts', value: .8}, {label: 'motion', value: .62}, {label: 'palette', value: .9}
  ]});
  const end = CF.scenes.end(stage, {start: 8.05, brand: 'CF', tagline: 'codefilm · scene kit'});

  function render(t) {
    title.render(t); cards.render(t); lines.render(t); chat.render(t);
    ledger.render(t); chart.render(t); end.render(t);
  }
  window.__seek = async (t) => { render(CF.clamp(t, 0, DUR)); return true; };
  window.render = (t) => render(CF.clamp(t, 0, DUR));
  window.__motion = (t0) => (t0 > 1.3 && t0 < 1.7) || (t0 > 2.9 && t0 < 3.3) || (t0 > 7.9 && t0 < 8.3) ? 500 : 40;
  window.__ready = Promise.resolve().then(() => { render(0); document.documentElement.dataset.ready = '1'; return true; });
  const q = new URLSearchParams(location.search);
  const external = q.has('external');
  if (q.has('t')) window.__ready.then(() => render(parseFloat(q.get('t'))));
  else if (q.has('play') || !external) window.__ready.then(() => {
    const loop = (ts) => { render((ts / 1000) % DUR); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
})();
</script>
</body>
</html>
