name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Compile Python
        run: |
          python -m py_compile skill/scripts/*.py skill/tests/*.py promo/vo.py promo/audio_build.py
      - name: Motion library tests
        run: |
          node skill/tests/test_motion.js
          node skill/tests/test_library.js
          node skill/tests/test_adapters.js
      - name: CLI tests
        run: |
          cd skill && python -m unittest discover -s tests -p "test_*.py"
      - name: Static composition checks
        run: |
          python skill/scripts/check.py skill/examples/demo/comp.html
          python skill/scripts/check.py skill/examples/motion-demo/comp.html
          python skill/scripts/check.py skill/examples/scene-demo/comp.html
          python skill/scripts/check.py skill/examples/looks-demo/comp.html
          python skill/scripts/check.py skill/examples/gsap-demo/comp.html --root skill
          python skill/scripts/check.py skill/examples/think-big/comp.html
          python skill/scripts/check.py promo/comp.html
      - name: Film checks
        run: |
          python skill/scripts/verify.py skill/examples/demo/out.mp4 --shots 0,1.6,3.0,4.8,7.0
          python skill/scripts/verify.py skill/examples/motion-demo/out.mp4
          python skill/scripts/verify.py skill/examples/scene-demo/out.mp4
          python skill/scripts/verify.py skill/examples/looks-demo/out.mp4
          python skill/scripts/verify.py skill/examples/gsap-demo/out.mp4
          python skill/scripts/verify.py skill/examples/think-big/out.mp4
